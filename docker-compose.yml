# ==============================================================
# Knotiq Rugs Lead Scraper Bot - Production Docker Compose Stack
# MySQL 8.0 + Node.js API & React SPA Dashboard
# ==============================================================

version: '3.8'

services:
  # ------------------------------------------------------------
  # MySQL Database Service
  # ------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: knotiq-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-knotiq_root_secure_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-lead_scraper_db}
      MYSQL_USER: ${DB_USER:-knotiq_app}
      MYSQL_PASSWORD: ${DB_PASS:-knotiq_app_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - knotiq-network

  # ------------------------------------------------------------
  # Application Service (Express API + Vite React Dashboard)
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knotiq-lead-scraper
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      APP_SECRET: ${APP_SECRET:-knotiq_prod_app_secret_at_least_32_characters_long}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:-knotiq_prod_signing_secret_32_chars_long}
      
      # Database Configuration
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lead_scraper_db}
      DB_USER: ${DB_USER:-knotiq_app}
      DB_PASS: ${DB_PASS:-knotiq_app_secure_pass_2026}
      DB_LOGGING: "false"

      # Authentication
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder_key_for_clerk_auth}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_placeholder_key_for_clerk_auth}
      ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-false}

      # Enrichment & AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-100}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}

      # Notifications & Outreach
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Knotiq Rugs <export@knotiqrugs.com>"}
      OUTREACH_DAILY_CAP: ${OUTREACH_DAILY_CAP:-30}
    volumes:
      - app_data:/app/data
    networks:
      - knotiq-network

volumes:
  mysql_data:
    name: knotiq_mysql_data
  app_data:
    name: knotiq_app_data

networks:
  knotiq-network:
    name: knotiq_network
    driver: bridge
